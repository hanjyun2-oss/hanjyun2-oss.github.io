<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/prestamos-bancarios/phone-template/assets/south-asset-logo.png" />
    <link rel="stylesheet" href="/prestamos-bancarios/fonts/typography.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="银行信贷交互演示，仅使用模拟数据。" />
    <title>银行信贷演示</title>
    <style>
      body { margin:0; }
      .app-boot { box-sizing:border-box; min-height:100dvh; margin:0; display:grid; place-items:center; padding:24px; color:#25434b; background:#effafa; font:14px/1.6 system-ui,sans-serif; }
      .app-boot-card { box-sizing:border-box; width:min(100%,480px); padding:26px; border:1px solid #c5ddd9; border-radius:8px; background:#faffff; }
      .app-boot-kicker { color:#137d79; font-size:11px; font-weight:700; letter-spacing:.12em; }
      .app-boot h1 { margin:10px 0; font-size:24px; line-height:1.3; }.app-boot p { margin:8px 0; }
      .app-boot button { margin-top:14px; padding:10px 15px; border:1px solid #0d756f; border-radius:7px; background:#0d756f; color:white; font:600 13px/1.4 system-ui,sans-serif; cursor:pointer; }
    </style>
    <script type="module" crossorigin src="/prestamos-bancarios/assets/index-D9DMrJKQ.js"></script>
    <link rel="stylesheet" crossorigin href="/prestamos-bancarios/assets/index-YXXs5obm.css">
  </head>
  <body>
    <div id="app">
      <main id="app-boot" class="app-boot" data-i18n-skip>
        <div class="app-boot-card" role="status">
          <span class="app-boot-kicker">AOS</span>
          <h1 id="app-boot-title">银行信贷演示</h1>
          <p id="app-boot-message">正在打开演示系统…</p>
          <button id="app-boot-retry" type="button" hidden>重新加载</button>
        </div>
      </main>
    </div>
    <script>
      (() => {
        const languages = ['zh-CN', 'en', 'es-419'];
        let language = 'zh-CN';
        try { const stored = localStorage.getItem('bank-credit-demo-locale'); if (languages.includes(stored)) language = stored; } catch {}
        const requested = new URLSearchParams(location.search).get('lang');
        if (languages.includes(requested)) language = requested;
        const text = {
          en: ['Bank credit demonstration', 'Opening the demonstration…', 'Loading is taking longer than usual. You can wait or reload the page.', 'The page could not be loaded. Check your connection and try again.', 'Reload page'],
          'es-419': ['Demostración de crédito bancario', 'Abriendo la demostración…', 'La carga está tardando más de lo habitual. Puede esperar o volver a cargar la página.', 'No se pudo cargar la página. Revise su conexión e inténtelo de nuevo.', 'Volver a cargar'],
          'zh-CN': ['银行信贷演示', '正在打开演示系统…', '加载时间较长，可以继续等待或重新加载页面。', '页面未能加载，请检查网络后重试。', '重新加载'],
        }[language];
        document.documentElement.lang = language;
        document.getElementById('app-boot-title').textContent = text[0];
        document.getElementById('app-boot-message').textContent = text[1];
        const retry = document.getElementById('app-boot-retry');
        retry.textContent = text[4]; retry.addEventListener('click', () => location.reload());
        const show = index => {
          const root = document.getElementById('app-boot');
          if (!root) return;
          root.querySelector('#app-boot-message').textContent = text[index];
          root.querySelector('#app-boot-retry').hidden = false;
        };
        setTimeout(() => show(2), 12000);
        window.addEventListener('bank-demo-start-failed', () => show(3));
        window.addEventListener('error', event => { if (event.target?.tagName === 'SCRIPT') show(3); }, true);
      })();
    </script>
  </body>
</html>
